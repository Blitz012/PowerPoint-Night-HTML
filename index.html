<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NONSTOP DEBATE — Trial 1</title>
<style>
  /* ============================================================
     GOODBYE NORTHSIDE — Nonstop Debate widget
     Single self-contained file. No external assets required.
     SWAP POINTS are marked with  >>> SWAP  comments.
     ============================================================ */

  :root{
    --stage:      #2e2e33;   /* dark grey stage (brief) */
    --edge:       #17171a;   /* vignette edge */
    --ink:        #0c0c0e;   /* hard outline */
    --paper:      #f4f2ec;   /* statement white */
    --weak:       #ffd400;   /* weak-point yellow (brief) */
    --dr-pink:    #ff2e88;   /* Danganronpa slam accent */
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100vw; height:100vh;
    max-width:100vw; max-height:100vh;
    overflow:hidden;
  }

  body{
    display:flex;
    background: radial-gradient(120% 120% at 50% 45%, var(--stage) 0 55%, var(--edge) 100%);
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  #stage{
    position:relative; flex:1 1 auto;
    width:100vw; height:100vh; overflow:hidden;
  }

  /* ---------- character portrait (center) ---------- */
  #portrait{
    position:absolute; left:50%; top:54%;
    transform:translate(-50%,-50%);
    width:min(34vh, 40vw); height:min(46vh, 55vw);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.2vmin;
    border:3px dashed #55555e; border-radius:6px;
    background:linear-gradient(180deg,#3a3a41,#26262b);
    box-shadow:0 30px 40px -20px rgba(0,0,0,.8);
  }
  /* >>> SWAP: delete the two children below and use instead:
       <img src="wania_smug.png" alt="Wania"
            style="width:100%;height:100%;object-fit:contain;">
     (also remove the dashed border above once real art is in)   */
  #portrait .silhouette{
    width:60%; height:62%;
    background:#101013;
    clip-path:polygon(50% 0,63% 8%,66% 22%,60% 34%,78% 44%,88% 66%,90% 100%,10% 100%,12% 66%,22% 44%,40% 34%,34% 22%,37% 8%);
    opacity:.85;
  }
  #portrait .portrait-label{
    color:#8b8b96; font-size:clamp(8px, 1.4vmin, 13px); letter-spacing:.18em; text-align:center;
    font-family:Arial, sans-serif; font-weight:700;
  }

  /* ---------- floating statements ---------- */
  .statement{
    position:absolute; white-space:nowrap;
    font-style:italic; font-weight:900;
    font-size:min(3.6vw, 5.2vmin);
    letter-spacing:.02em;
    color:var(--paper);
    /* hard multi-directional shadow = projector-legible outline */
    text-shadow:
      2px 2px 0 var(--ink), -2px 2px 0 var(--ink),
      2px -2px 0 var(--ink), -2px -2px 0 var(--ink),
      6px 8px 12px rgba(0,0,0,.55);
    pointer-events:none;              /* only the weak point is clickable */
    will-change:transform;
  }
  .statement .speaker{
    font-size:.5em; font-style:normal; letter-spacing:.14em;
    color:#b9b9c4; display:block; margin-bottom:.1em;
  }

  /* three drift lanes — negative delays mean the screen is alive at frame one */
  .s1{ top:14%; transform:rotate(-3deg); animation:driftL 13s linear -6s  infinite; }
  .s2{ top:74%; transform:rotate( 2deg); animation:driftR 15s linear -3s  infinite; }
  .s3{ top:40%; transform:rotate(-2deg); animation:driftL 10s linear -1.5s infinite; }

  @keyframes driftL{ from{ left:105vw; } to{ left:-80vw; } }
  @keyframes driftR{ from{ left:-80vw; } to{ left:105vw; } }

  /* ---------- the weak point ---------- */
  .weakpoint{
    color:var(--weak);
    pointer-events:auto; cursor:crosshair;
    text-shadow:
      2px 2px 0 var(--ink), -2px 2px 0 var(--ink),
      2px -2px 0 var(--ink), -2px -2px 0 var(--ink),
      0 0 18px rgba(255,212,0,.65);
    animation:weakpulse 1.1s ease-in-out infinite;
    outline:none;
  }
  .weakpoint:focus-visible{ outline:3px solid var(--weak); outline-offset:6px; }
  @keyframes weakpulse{
    0%,100%{ filter:brightness(1); }
    50%    { filter:brightness(1.45); }
  }

  /* ---------- fired state: freeze, shake, flash, slam ---------- */
  .fired .statement{
    animation-play-state:paused;      /* stops the drift dead where it stands */
    filter:grayscale(1) brightness(.45);
    transition:filter .4s ease .25s;
  }
  .fired .weakpoint{ animation-play-state:paused; }

  .fired #stage{ animation:shake .5s linear 1; }
  @keyframes shake{
    0%{transform:translate(0,0)}          10%{transform:translate(-14px,8px) rotate(-.6deg)}
    20%{transform:translate(12px,-10px)}  30%{transform:translate(-10px,-8px) rotate(.5deg)}
    40%{transform:translate(10px,10px)}   50%{transform:translate(-8px,4px)}
    60%{transform:translate(8px,-6px)}    70%{transform:translate(-6px,-4px)}
    80%{transform:translate(4px,4px)}     90%{transform:translate(-2px,2px)}
    100%{transform:translate(0,0)}
  }

  #flash{
    position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:8;
  }
  .fired #flash{ animation:flashout .35s ease-out 1; }
  @keyframes flashout{ 0%{opacity:1} 100%{opacity:0} }

  /* ---------- "NO, THAT'S WRONG!" ---------- */
  #objection{
    position:fixed; inset:0; z-index:9;
    display:none; align-items:center; justify-content:center;
    text-align:center;
  }
  .fired #objection{ display:flex; }

  /* conic speed-line burst behind the slam */
  #objection::before{
    content:""; position:absolute; inset:-40%;
    background:repeating-conic-gradient(from 0deg,
      rgba(255,255,255,.10) 0deg 3deg, transparent 3deg 11deg);
    animation:burst 6s linear infinite;
  }
  @keyframes burst{ to{ transform:rotate(60deg); } }

  #objection span{
    position:relative;
    font-size:min(15vw, 22vmin);
    line-height:.92;
    font-weight:900;
    transform:skewX(-6deg) rotate(-6deg);
    color:#fff;
    text-shadow:
      4px 4px 0 var(--dr-pink), 8px 8px 0 var(--ink),
      -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink),
      0 0 60px rgba(255,46,136,.5);
    animation:slam .38s cubic-bezier(.2,1.6,.35,1) 1;
  }
  @keyframes slam{
    0%  { transform:skewX(-6deg) rotate(-14deg) scale(3.4); opacity:0; }
    55% { transform:skewX(-6deg) rotate(-5deg)  scale(.94); opacity:1; }
    100%{ transform:skewX(-6deg) rotate(-6deg)  scale(1); }
  }

  #hint{
    position:fixed; left:50%; bottom:4vh; transform:translateX(-50%);
    max-width:94vw; text-align:center; white-space:nowrap;
    color:#8b8b96; font-family:Arial, sans-serif; font-weight:700;
    font-size:clamp(9px, 1.7vmin, 15px); letter-spacing:.22em; text-transform:uppercase;
    transition:opacity .3s; z-index:5;
  }
  .fired #hint{ opacity:0; }

  /* calm mode for anyone who needs it: statements park, no shake */
  @media (prefers-reduced-motion: reduce){
    .s1{ left:8vw;  animation:none; }
    .s2{ left:20vw; animation:none; }
    .s3{ left:30vw; animation:none; }
    .fired #stage{ animation:none; }
    #objection::before{ animation:none; }
  }
</style>
</head>
<body>
  <div id="stage">

    <div id="portrait" aria-hidden="true">
      <div class="silhouette"></div>
      <div class="portrait-label">CHARACTER PORTRAIT<br>(drop image here)</div>
    </div>

    <!-- >>> SWAP: statement text lives here. Keep the weak point inside
         a <span class="weakpoint"> — that span is the only clickable thing. -->
    <div class="statement s1"><span class="speaker">PETER</span>"The sign-out sheet puts a certain someone in that gym..."</div>
    <div class="statement s2"><span class="speaker">AVI</span>"I left at 9:40! It's literally on the sheet!"</div>
    <div class="statement s3"><span class="speaker">WANIA</span>"Nobody in this school could drop Cooper in <span class="weakpoint" tabindex="0" role="button" aria-label="Fire at the weak point">ONE HIT!</span>"</div>

    <div id="flash"></div>

    <div id="objection" aria-live="assertive">
      <span>NO, THAT'S<br>WRONG!</span>
    </div>

    <div id="hint">Find the weak point &mdash; click the yellow text</div>
  </div>

<script>
  /* ============================================================
     Interaction: click (or press Enter on) the yellow weak point.
     -> freeze all drift animations   (CSS: animation-play-state)
     -> white flash + screen shake    (CSS keyframes, class-driven)
     -> slam the objection graphic    (CSS slam animation)
     Click anywhere AFTER firing to reset — handy for rehearsal.
     ============================================================ */

  const body = document.body;
  const weak = document.querySelector('.weakpoint');

  function fire(e){
    e.stopPropagation();
    if (body.classList.contains('fired')) return;
    body.classList.add('fired');
    playSting();
    /* re-arm the reset one tick later so this same click doesn't trigger it */
    setTimeout(() => body.addEventListener('click', reset, { once:true }), 0);
  }

  function reset(){
    body.classList.remove('fired');
  }

  weak.addEventListener('click', fire);
  weak.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') fire(e);
  });

  /* ---------- sound ----------
     Self-contained synth sting (no audio file needed): a noise crack
     plus a falling square-wave zap, WebAudio only. Runs because it's
     triggered by a user click, so autoplay policies allow it.

     >>> SWAP: to use a real sound instead, replace playSting() with:
         function playSting(){ new Audio('objection.mp3').play(); }      */
  function playSting(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;

      /* noise crack */
      const len = ctx.sampleRate * 0.18;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random()*2-1) * (1 - i/len);
      const noise = ctx.createBufferSource(); noise.buffer = buf;
      const nGain = ctx.createGain();
      nGain.gain.setValueAtTime(0.5, now);
      nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      noise.connect(nGain).connect(ctx.destination);
      noise.start(now);

      /* falling zap */
      const osc = ctx.createOscillator(); osc.type = 'square';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.30);
      const oGain = ctx.createGain();
      oGain.gain.setValueAtTime(0.28, now);
      oGain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      osc.connect(oGain).connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.34);
    }catch(err){ /* no audio context available — stay silent, never break the trial */ }
  }
</script>
</body>
</html>
